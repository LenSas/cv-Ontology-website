<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sascha Scheske — Ontology CV</title>
  <!-- Rdflib.js für das Parsen von RDF/XML im Browser -->
<script src="https://cdn.jsdelivr.net/npm/rdflib@2.2.32/dist/rdflib.min.js"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#17202b;--muted:#697586;--line:#e3e7ed;--accent:#3459d1;--accent-soft:#edf1ff;--green:#237a61;--shadow:0 8px 28px rgba(25,39,65,.055)}*{box-sizing:border-box}body[...]
<body><div class="shell">
<header class="topbar"><div class="brand">S.L<span>.</span> SCHESKE <span style="font-weight:450;color:#8a94a3">/ ONTOLOGY CV</span></div><div class="topnote">A structured view of experience, skills a[...]
<div class="tab-row">
  <button class="tab active" data-tab="experience" type="button">Experience</button>
  <button class="tab" data-tab="profile" type="button">Profile</button>
  <button class="tab" data-tab="graph" type="button">Graph</button>
</div>
<section class="hero"><div><div class="eyebrow">Technical Communication · Information Architecture</div><h1>Experience, connected.</h1><p class="intro">An interactive exploration of my professional b[...]
<section id="experienceView"><div class="layout"><aside class="sidebar"><div class="sidehead"><h2>Filter</h2><button class="clear" id="clearFilters" type="button">Reset</button></div><div class="field[...]
<section id="profileView" class="hidden"></section>
<section id="graphView" class="hidden"><div class="panel"><div class="eyebrow">Knowledge model</div><h2 style="margin:7px 0;font-size:25px;letter-spacing:-.04em">The CV as a graph</h2><p class="intro"[...]
<section id="detailView" class="hidden"></section>
<div class="footer">Prototype · Content and relationships are derived from the RDF ontology and linked resource naming conventions.</div></div>
<script>
  const CV = $rdf.Namespace("https://scheske.leander/ontology/cv#");
  const RDF = $rdf.Namespace("http://www.w3.org/1999/02/22-rdf-syntax-ns#");
  const RDFS = $rdf.Namespace("http://www.w3.org/2000/01/rdf-schema#");

  let entries = [];
  let profile = {};
  let selectedSkills = new Set();
  let selectedTech = new Set();
  let ontologyStore = null;

  function normalizeFilterValue(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function normalizeTypeKey(value) {
    return String(value || '')
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .toLowerCase()
      .replace(/[^a-z0-9]/g, '');
  }

  function iriLocalName(node) {
    if (!node) return '';
    const value = typeof node === 'string' ? node : (node.value || '');
    if (!value) return '';
    return decodeURIComponent(value.split('#').pop().split('/').pop());
  }

  function getLabel(store, ind) {
    if (!ind) return '';
    const labelNode = store.any(ind, RDFS('label'));
    if (labelNode) return labelNode.value;
    const value = typeof ind === 'string' ? ind : (ind.value || '');
    return value ? iriLocalName({ value }) : '';
  }

  function getDataProp(store, ind, prop) {
    if (!ind) return '';
    const val = store.any(ind, prop);
    return val ? val.value : '';
  }

  function getListProps(store, ind, prop) {
    if (!ind) return [];
    return store.each(ind, prop).map(node => getLabel(store, node));
  }

  function normalizeValue(value) {
    return (value || '').trim();
  }

  function getPersonNode(store) {
    const persons = store.each(undefined, RDF('type'), CV('Person'));
    return persons[0] || null;
  }

  function getKindLabel(store, node) {
    if (!node) return 'Experience';
    const types = store.each(node, RDF('type'));
    for (const type of types) {
      const label = getLabel(store, type);
      if (label && label !== 'Experience') return label;
    }
    return 'Experience';
  }

  function getKindKey(store, node) {
    const types = store.each(node, RDF('type'));

    for (const type of types) {
      const localName = iriLocalName(type);

      if (['WorkPath', 'Project', 'EducationalPath'].includes(localName)) {
        return localName.toLowerCase();
      }
    }

    return '';
  }

  function getLinkedResource(store, subject, prop) {
    if (!subject) return null;
    return store.any(subject, prop) || null;
  }

  function buildEntry(node) {
    const kind = getKindLabel(ontologyStore, node);
    const iriId = iriLocalName(node);
    const title = getLabel(ontologyStore, node) || iriId || 'Entry';
    const startDate = normalizeValue(getDataProp(ontologyStore, node, CV('startDate')));
    const endDate = normalizeValue(getDataProp(ontologyStore, node, CV('endDate')));
    const company = normalizeValue(getDataProp(ontologyStore, node, CV('companyName')))
      || normalizeValue(getDataProp(ontologyStore, node, CV('fieldOfStudy')))
      || 'Organization';
    const role = normalizeValue(getDataProp(ontologyStore, node, CV('degreeName')))
      || normalizeValue(getDataProp(ontologyStore, node, CV('employmentType')))
      || title;
    const summaryNode = getLinkedResource(ontologyStore, node, CV('hasSummary'));
    const descriptionNode = getLinkedResource(ontologyStore, node, CV('hasDescription'));
    const skills = getListProps(ontologyStore, node, CV('learnedSkill'));
    const tech = getListProps(ontologyStore, node, CV('learnedTechnology'));

    const typeKeys = [...new Set(
      ontologyStore.each(node, RDF('type')).flatMap(typeNode => {
        const candidates = [
          getLabel(ontologyStore, typeNode),
          iriLocalName(typeNode),
          kind,
          iriId
        ];
        return candidates.map(normalizeTypeKey).filter(Boolean);
      })
    )];

    return {
      node,
      id: title,
      iriId,
      kind,
      kindKey: getKindKey(ontologyStore, node) || typeKeys[0] || normalizeTypeKey(kind),
      typeKeys,
      dates: [startDate, endDate].filter(Boolean).join(' — ') || '',
      company,
      role,
      summaryNode,
      descriptionNode,
      summaryFile: summaryNode ? `content/summaries/${iriLocalName(summaryNode)}.txt` : '',
      descriptionFile: descriptionNode ? `content/descriptions/${iriLocalName(descriptionNode)}.html` : '',
      skills,
      skillKeys: skills.map(normalizeFilterValue),
      tech,
      techKeys: tech.map(normalizeFilterValue)
    };
  }

  function parseEntries(store) {
    entries = [];
    const nodes = [
      ...store.each(undefined, RDF('type'), CV('WorkPath')),
      ...store.each(undefined, RDF('type'), CV('Project')),
      ...store.each(undefined, RDF('type'), CV('EducationalPath'))
    ];

    const seen = new Set();
    nodes.forEach(node => {
      if (!node) return;
      const key = node.value || '';
      if (!key || seen.has(key)) return;
      seen.add(key);
      entries.push(buildEntry(node));
    });

    entries.sort((a, b) => a.id.localeCompare(b.id));
  }

  function renderProfile(store) {
    const person = getPersonNode(store);
    const profileView = document.getElementById('profileView');
    if (!profileView) return;

    const name = person ? (getDataProp(store, person, CV('fullName')) || getLabel(store, person)) : 'Sascha Scheske';
    const birthDate = person ? getDataProp(store, person, CV('dateOfBirth')) : '';
    const email = person ? getDataProp(store, person, CV('emailAddress')) : '';
    const languages = person ? getListProps(store, person, CV('hasLanguage')) : [];
    const education = person ? getListProps(store, person, CV('hasEducation')) : [];

    profile.fullName = name;
    profile.birthDate = birthDate;
    profile.email = email;
    profile.languages = languages;
    profile.education = education;

    const languageHtml = languages.length ? languages.map(x => `<span class="tag">${x}</span>`).join('') : '<span class="tag">—</span>';
    const educationHtml = education.length ? education.map(x => `<span class="tag">${x}</span>`).join('') : '<span class="tag">—</span>';

    profileView.innerHTML = `
      <div class="panel">
        <div class="profile-head">
          <div class="avatar" style="width:140px;height:140px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#eef2ff;color:#1c2d5d;font-weight:700[...]
            <img src="images/SaschaBewerbung_18.3.23-9.jpg" alt="${name}" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div>
            <h2 style="margin:0 0 6px 0;">${name}</h2>
            <p class="eyebrow">Technical Communication · Semantic Information Architecture</p>
            <div class="meta-row">
              ${birthDate ? `<span>Birth date: ${birthDate}</span>` : ''}
              ${email ? `<span>Email: ${email}</span>` : ''}
            </div>
          </div>
        </div>

        <div class="profile-grid">
          <div class="profile-card">
            <h3>Education</h3>
            <div class="tags">${educationHtml}</div>
          </div>
          <div class="profile-card">
            <h3>Languages</h3>
            <div class="tags">${languageHtml}</div>
          </div>
        </div>
      </div>
    `;
  }

  async function loadTextResource(url, fallbackText) {
    if (!url) return fallbackText;
    try {
      const res = await fetch(url);
      if (!res.ok) return fallbackText;
      return await res.text();
    } catch (err) {
      return fallbackText;
    }
  }

  async function showDetail(entry) {
    document.getElementById('experienceView').classList.add('hidden');
    document.getElementById('profileView').classList.add('hidden');
    document.getElementById('graphView').classList.add('hidden');

    const detailView = document.getElementById('detailView');
    detailView.classList.remove('hidden');

    const descriptionNode = entry.descriptionNode || getLinkedResource(ontologyStore, entry.node, CV('hasDescription'));
    const summaryNode = entry.summaryNode || getLinkedResource(ontologyStore, entry.node, CV('hasSummary'));

    const fallbackDescription = descriptionNode ? getLabel(ontologyStore, descriptionNode) : 'No description available.';
    const fallbackSummary = summaryNode ? getLabel(ontologyStore, summaryNode) : 'No summary available.';

    const fullDescription = await loadTextResource(entry.descriptionFile, fallbackDescription || fallbackSummary);

    detailView.innerHTML = `
      <div class="detail-panel">
        <button class="back" id="back" type="button">← Back to overview</button>
        <div class="eyebrow">${entry.kind}</div>
        <h2>${entry.id}</h2>
        <div class="detail-meta">${entry.company || ''} · ${entry.role || ''} · ${entry.dates || ''}</div>

        <h3>Description</h3>
        <div class="description-content">${fullDescription}</div>

        <h3>Skills</h3>
        <div class="tags">
          ${entry.skills.length ? entry.skills.map(x => `<span class="tag">${x}</span>`).join('') : '<span class="tag">—</span>'}
        </div>

        <h3>Technologies</h3>
        <div class="tags">
          ${entry.tech.length ? entry.tech.map(x => `<span class="tag">${x}</span>`).join('') : '<span class="tag">—</span>'}
        </div>
      </div>
    `;

    document.getElementById('back').onclick = () => {
      detailView.classList.add('hidden');
      document.getElementById('experienceView').classList.remove('hidden');
    };
  }

  function getBaseEntries() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const checkedTypeKeys = [...document.querySelectorAll('.typefilter:checked')].map(x => normalizeTypeKey(x.value));

    return entries.filter(e => {
      const matchesType = checkedTypeKeys.length === 0 || checkedTypeKeys.includes(e.kindKey);
      const matchesText = !q || [e.id, e.kind, e.company, e.role, ...(e.skills || []), ...(e.tech || [])].join(' ').toLowerCase().includes(q);
      const matchesSkill = [...selectedSkills].every(s => (e.skillKeys || []).includes(s));
      const matchesTech = [...selectedTech].every(t => (e.techKeys || []).includes(t));
      return matchesType && matchesText && matchesSkill && matchesTech;
    });
  }

  function makeChips(id, selectedSet, baseList, field) {
    const box = document.getElementById(id);
    if (!box) return;

    box.innerHTML = '';

    const allItems = [...new Set(entries.flatMap(e => e[field] || []))].sort((a, b) => a.localeCompare(b));
    const available = allItems.filter(item => {
      const itemKey = normalizeFilterValue(item);
      if (selectedSet.has(itemKey)) return true;
      const count = baseList.filter(e => (e[field] || []).map(normalizeFilterValue).includes(itemKey)).length;
      return count > 0 && count < baseList.length;
    });

    available.forEach(item => {
      const itemKey = normalizeFilterValue(item);
      const count = baseList.filter(e => (e[field] || []).map(normalizeFilterValue).includes(itemKey)).length;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (selectedSet.has(itemKey) ? ' active' : '');
      btn.textContent = item + (selectedSet.has(itemKey) ? '' : ` · ${count}`);
      btn.onclick = () => {
        if (selectedSet.has(itemKey)) selectedSet.delete(itemKey);
        else selectedSet.add(itemKey);
        renderCards();
      };
      box.appendChild(btn);
    });
  }

  async function renderCards() {
    const list = getBaseEntries();

    makeChips('skillFilters', selectedSkills, list, 'skills');
    makeChips('techFilters', selectedTech, list, 'tech');

    const cards = document.getElementById('cards');
    const resultCount = document.getElementById('resultCount');
    const empty = document.getElementById('empty');

    cards.innerHTML = '';
    resultCount.textContent = `${list.length} ${list.length === 1 ? 'Eintrag' : 'Einträge'}`;
    empty.classList.toggle('hidden', list.length > 0);

    for (const e of list) {
      const summaryText = await loadTextResource(e.summaryFile, e.summaryNode ? getLabel(ontologyStore, e.summaryNode) : 'No summary available.');

      const card = document.createElement('article');
      card.className = 'card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="cardtop">
          <span class="kind">${e.kind}</span>
          <span class="dates">${e.dates}</span>
        </div>
        <h3>${e.id}</h3>
        <div class="company">${e.company} · ${e.role}</div>
        <p class="summary">${summaryText}</p>
        <div class="tags">
          ${(e.skills || []).slice(0, 3).concat((e.tech || []).slice(0, 2))
            .map(t => `<span class="tag">${t}</span>`)
            .join('') || '<span class="tag">—</span>'}
        </div>
        <div class="openhint">Details ansehen ↗</div>
      `;

      card.onclick = () => showDetail(e);
      cards.appendChild(card);
    }
  }

  async function loadOntologyAndBuildCV() {
    const store = $rdf.graph();
    const relativeUrl = 'ontology/CV-Ontology.rdf';
    const absoluteUrl = new URL(relativeUrl, window.location.href).href;

    try {
      const response = await fetch(relativeUrl);
      if (!response.ok) throw new Error('The RDF file could not be loaded.');
      const rdfText = await response.text();
      $rdf.parse(rdfText, store, absoluteUrl, 'application/rdf+xml');
      ontologyStore = store;

      parseEntries(store);
      renderProfile(store);
      renderCards();
    } catch (error) {
      console.error('Error loading RDF file:', error);
      const cards = document.getElementById('cards');
      if (cards) cards.innerHTML = `<p class="empty">Error loading RDF data: ${error.message}</p>`;
    }
  }

  document.getElementById('search').addEventListener('input', renderCards);
  document.querySelectorAll('.typefilter').forEach(x => x.addEventListener('change', renderCards));

  document.getElementById('clearFilters').onclick = () => {
    document.getElementById('search').value = '';
    document.querySelectorAll('.typefilter').forEach(x => x.checked = false);
    selectedSkills.clear();
    selectedTech.clear();
    renderCards();
  };

  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tab));
      ['experienceView', 'profileView', 'graphView', 'detailView'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      const targetMap = {
        experience: 'experienceView',
        profile: 'profileView',
        graph: 'graphView'
      };
      const target = targetMap[tab.dataset.tab];
      if (target) document.getElementById(target).classList.remove('hidden');
    };
  });

  loadOntologyAndBuildCV();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ontology CV – Faceted Search</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-alt: #f3f6fb;
      --border: #dfe7f3;
      --text: #1f2a37;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #0f766e;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      --disabled: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 80%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem 1.25rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand .accent { color: var(--primary); }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) minmax(180px, 0.8fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-box,
    .category-box,
    .filters-panel,
    .results-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .search-box,
    .category-box {
      padding: 1rem 1.1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    input[type="search"],
    select {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.98rem;
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .filters-panel {
      padding: 1rem 1rem 1.25rem;
      position: sticky;
      top: 1rem;
    }

    .filter-section + .filter-section {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .filter-section h3 {
      margin: 0 0 0.8rem;
      font-size: 1rem;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-alt);
      transition: 0.18s ease;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-option:hover:not(.disabled) {
      border-color: rgba(37, 99, 235, 0.5);
      background: #eff6ff;
    }

    .checkbox-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      margin: 0;
      cursor: pointer;
    }

    .checkbox-option.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.1);
    }

    .checkbox-option.disabled input,
    .checkbox-option.disabled span {
      cursor: not-allowed;
    }

    .checkbox-option input:disabled {
      cursor: not-allowed;
    }

    .results-panel {
      padding: 1rem 1.2rem 1.4rem;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-weight: 700;
      color: var(--muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background: linear-gradient(180deg, #fff, #f9fbff);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 0.35rem 0.7rem;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.08rem;
    }

    .card-subtitle {
      margin-bottom: 0.7rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .card-summary {
      margin: 0 0 0.85rem;
      color: var(--text);
      line-height: 1.45;
      min-height: 3.2em;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      padding: 0.38rem 0.6rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 600;
    }

    .tag.skill {
      background: #ecfeff;
      color: #115e59;
      border-color: #a7f3d0;
    }

    .tag.tech {
      background: #eef2ff;
      color: #3730a3;
      border-color: #c7d2fe;
    }

    .empty-state {
      border: 1px dashed var(--border);
      background: #f8fafc;
      border-radius: 14px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .filters-panel { position: static; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="accent">CV</span> Ontology</div>
      <div class="meta">Faceted search over experience, skills, and technologies</div>
    </header>

    <section class="toolbar">
      <div class="search-box">
        <label for="search-input">Search</label>
        <input id="search-input" type="search" placeholder="Search by title, company, skill, technology..." />
      </div>

      <div class="category-box">
        <label for="category-select">Experience category</label>
        <select id="category-select">
          <option value="all">All categories</option>
        </select>
      </div>
    </section>

    <div class="layout">
      <aside class="filters-panel">
        <div class="filter-section">
          <h3>Skills</h3>
          <div id="skill-options" class="checkbox-group"></div>
        </div>

        <div class="filter-section">
          <h3>Technologies</h3>
          <div id="tech-options" class="checkbox-group"></div>
        </div>
      </aside>

      <main class="results-panel">
        <div class="results-header">
          <div id="results-count" class="results-count">Loading...</div>
        </div>

        <div id="cards-grid" class="cards-grid"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/rdflib@2.2.32/dist/rdflib.min.js" defer></script>
  <script>
    let store = null;
    let RDF = null;
    let RDFS = null;
    let CV = null;

    const state = {
      search: '',
      category: 'all',
      skills: new Set(),
      techs: new Set()
    };

    let allEntries = [];
    let allCategories = [];
    let allSkills = [];
    let allTechs = [];

    document.addEventListener('DOMContentLoaded', () => {
      bindControls();
      loadOntology();
    });

    function bindControls() {
      const searchInput = document.getElementById('search-input');
      const categorySelect = document.getElementById('category-select');

      searchInput.addEventListener('input', (event) => {
        state.search = event.target.value.trim().toLowerCase();
        recalcFilters();
      });

      categorySelect.addEventListener('change', (event) => {
        state.category = event.target.value;
        recalcFilters();
      });

      document.addEventListener('change', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;

        if (target.dataset.group === 'skill') {
          const skill = target.value;
          if (target.checked) state.skills.add(skill);
          else state.skills.delete(skill);
          recalcFilters();
        }

        if (target.dataset.group === 'tech') {
          const tech = target.value;
          if (target.checked) state.techs.add(tech);
          else state.techs.delete(tech);
          recalcFilters();
        }
      });
    }

    async function loadOntology() {
      try {
        store = $rdf.graph();
        RDF = $rdf.Namespace('http://www.w3.org/1999/02/22-rdf-syntax-ns#');
        RDFS = $rdf.Namespace('http://www.w3.org/2000/01/rdf-schema#');
        CV = $rdf.Namespace('https://scheske.leander/ontology/cv#');

        const relUrl = 'ontology/CV-Ontology.rdf';
        const absoluteUrl = new URL(relUrl, window.location.href).href;
        const response = await fetch(relUrl);

        if (!response.ok) {
          throw new Error('Failed to load ontology. Ensure the repository is served with a local web server.');
        }

        const rdfText = await response.text();
        $rdf.parse(rdfText, store, absoluteUrl, 'application/rdf+xml');

        parseExperienceEntries();
        renderFilterOptions();
        recalcFilters();
      } catch (error) {
        console.error(error);
        const grid = document.getElementById('cards-grid');
        grid.innerHTML = `
          <div class="empty-state">
            <strong>Ontology could not be loaded.</strong><br />
            <span>${escapeHtml(error.message)}</span>
          </div>
        `;
      }
    }

    function parseExperienceEntries() {
      allEntries = [];
      allCategories = [];
      allSkills = [];
      allTechs = [];

      const categoryMap = [
        { classNode: CV('WorkPath'), label: 'Work Path' },
        { classNode: CV('Project'), label: 'Project' },
        { classNode: CV('EducationalPath'), label: 'Educational Path' }
      ];

      const skillSet = new Set();
      const techSet = new Set();
      const categorySet = new Set();

      categoryMap.forEach(({ classNode, label }) => {
        categorySet.add(label);
        const individuals = store.each(undefined, RDF('type'), classNode);

        individuals.forEach((ind) => {
          const iriId = ind.value.split('#').pop();
          const title = getLabel(ind);
          const startDate = getDataProp(ind, CV('startDate')) || '';
          const endDate = getDataProp(ind, CV('endDate')) || 'Present';
          const companyName = getDataProp(ind, CV('companyName')) || '';
          const employmentType = getDataProp(ind, CV('employmentType')) || '';
          const degreeName = getDataProp(ind, CV('degreeName')) || '';
          const fieldOfStudy = getDataProp(ind, CV('fieldOfStudy')) || '';
          const partOfNode = store.any(ind, CV('partOf'));
          const partOfLabel = partOfNode ? getLabel(partOfNode) : '';

          const skills = getListProps(ind, CV('learnedSkill'));
          const technologies = getListProps(ind, CV('learnedTechnology'));

          skills.forEach((skill) => skillSet.add(skill.label));
          technologies.forEach((technology) => techSet.add(technology.label));

          let orgDisplay = companyName || fieldOfStudy || partOfLabel || '';
          if (degreeName) {
            orgDisplay = `${degreeName}${fieldOfStudy ? ` in ${fieldOfStudy}` : ''}`;
            if (partOfLabel) orgDisplay += ` (${partOfLabel})`;
          }

          allEntries.push({
            iri: ind.value,
            iriId,
            title,
            category: label,
            startDate,
            endDate,
            company: orgDisplay,
            employmentType,
            skills,
            technologies,
            summaryFile: `content/summaries/${iriId}Summary.txt`,
            descriptionFile: `content/descriptions/${iriId}Description.txt`
          });
        });
      });

      allCategories = Array.from(categorySet).sort();
      allSkills = Array.from(skillSet).sort();
      allTechs = Array.from(techSet).sort();

      allEntries.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
    }

    function getLabel(node) {
      if (!node) return '';
      const labelStmt = store.any(node, RDFS('label'));
      if (labelStmt && labelStmt.value) return labelStmt.value;

      const value = node.value || '';
      if (value.includes('#')) return value.split('#').pop();
      return value.split('/').pop();
    }

    function getDataProp(ind, prop) {
      const stmt = store.any(ind, prop);
      return stmt ? stmt.value : '';
    }

    function getListProps(ind, prop) {
      const nodes = store.each(ind, prop);
      return nodes.map((node) => ({
        iri: node.value,
        label: getLabel(node)
      }));
    }

    function renderFilterOptions() {
      const categorySelect = document.getElementById('category-select');
      categorySelect.innerHTML = ['<option value="all">All categories</option>']
        .concat(allCategories.map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`))
        .join('');
      categorySelect.value = state.category;

      const skillContainer = document.getElementById('skill-options');
      skillContainer.innerHTML = allSkills.map((skill) => {
        const checked = state.skills.has(skill);
        const disabled = !checked && !wouldAllowSelection('skill', skill);
        return `
          <label class="checkbox-option ${disabled ? 'disabled' : ''}">
            <input type="checkbox" data-group="skill" value="${escapeHtml(skill)}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} />
            <span>${escapeHtml(skill)}</span>
          </label>
        `;
      }).join('');

      const techContainer = document.getElementById('tech-options');
      techContainer.innerHTML = allTechs.map((tech) => {
        const checked = state.techs.has(tech);
        const disabled = !checked && !wouldAllowSelection('tech', tech);
        return `
          <label class="checkbox-option ${disabled ? 'disabled' : ''}">
            <input type="checkbox" data-group="tech" value="${escapeHtml(tech)}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} />
            <span>${escapeHtml(tech)}</span>
          </label>
        `;
      }).join('');
    }

    function recalcFilters() {
      renderFilterOptions();
      const filteredEntries = getFilteredEntries();
      renderCards(filteredEntries);
      syncResultsText(filteredEntries.length);
    }

    function syncResultsText(count) {
      const resultsCount = document.getElementById('results-count');
      resultsCount.textContent = `Showing ${count} of ${allEntries.length} experiences`;
    }

    function wouldAllowSelection(group, value) {
      const skillSet = new Set(state.skills);
      const techSet = new Set(state.techs);

      if (group === 'skill') skillSet.add(value);
      else techSet.add(value);

      return getFilteredEntriesWithState(state.search, state.category, skillSet, techSet).length > 0;
    }

    function getFilteredEntriesWithState(searchText, selectedCategory, selectedSkills, selectedTechs) {
      const normalizedSearch = searchText.toLowerCase();

      return allEntries.filter((entry) => {
        const matchesCategory = selectedCategory === 'all' || entry.category === selectedCategory;

        const entrySkillLabels = entry.skills.map((s) => s.label.toLowerCase());
        const entryTechLabels = entry.technologies.map((t) => t.label.toLowerCase());
        const textFields = [
          entry.title,
          entry.company,
          entry.category,
          entry.employmentType,
          ...entrySkillLabels,
          ...entryTechLabels,
          entry.iriId
        ].join(' ').toLowerCase();

        const matchesSearch = !normalizedSearch || textFields.includes(normalizedSearch);

        const matchesSkillFilters = Array.from(selectedSkills).every((skill) => entrySkillLabels.includes(skill.toLowerCase()));
        const matchesTechFilters = Array.from(selectedTechs).every((tech) => entryTechLabels.includes(tech.toLowerCase()));

        return matchesCategory && matchesSearch && matchesSkillFilters && matchesTechFilters;
      });
    }

    function getFilteredEntries() {
      return getFilteredEntriesWithState(state.search, state.category, state.skills, state.techs);
    }

    function renderCards(entries) {
      const grid = document.getElementById('cards-grid');

      if (!entries.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <strong>No matching experiences found.</strong><br />
            Try a different search, category, or filter combination.
          </div>
        `;
        return;
      }

      grid.innerHTML = entries.map((entry) => `
        <article class="card">
          <div class="card-top">
            <span class="badge">${escapeHtml(entry.category)}</span>
            <span>${escapeHtml(entry.startDate)} &mdash; ${escapeHtml(entry.endDate)}</span>
          </div>
          <h3>${escapeHtml(entry.title)}</h3>
          <div class="card-subtitle">
            ${entry.employmentType ? `${escapeHtml(entry.employmentType)}${entry.company ? ' at ' : ''}` : ''}${escapeHtml(entry.company)}
          </div>
          <p class="card-summary">
            ${escapeHtml(entry.summaryFile ? 'Summary available from the ontology-backed CV data set.' : 'No summary file linked.')}
          </p>

          <div class="tags">
            ${entry.skills.map((skill) => `<span class="tag skill">${escapeHtml(skill.label)}</span>`).join('')}
            ${entry.technologies.map((tech) => `<span class="tag tech">${escapeHtml(tech.label)}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
